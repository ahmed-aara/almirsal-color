<section class="projects" id="projects" aria-labelledby="projects-title">
    <div class="projects-layout">
        <app-section-heading class="projects-heading" uk-scrollspy="cls: uk-animation-slide-bottom-small; delay: 100"
            eyebrow="مشروعات وثقت بنا" title="أعمالنا تتحدث عن جودة منتجاتنا" headingId="projects-title"
            align="start" [lined]="true">
            <p class="projects-intro">نفخر بمشاريعنا المختلفة التي تعكس الثقة في جودة منتجاتنا ودورها في بناء مجتمعات
                أجمل وأكثر استدامة.</p>
        </app-section-heading>

        <!-- Featured project -->
        <div class="featured" uk-scrollspy="cls: uk-animation-slide-bottom-small; delay: 150"
            (touchstart)="swipe.start($event)" (touchend)="onSwipe($event)">
            <div class="featured-photo">
                <img *ngFor="let item of featured ? [featured] : []; trackBy: trackById"
                    [src]="'assets/img/projects/' + item.img" [alt]="item.name" loading="lazy">
            </div>

            <div class="quality-badge">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z" />
                    <path d="m8.5 12 2.5 2.5 4.5-5" />
                </svg>
                <div>
                    <strong>جودة تدوم</strong>
                    <span>بألواننا.. نبني مستقبل أفضل</span>
                </div>
            </div>

            <div class="featured-nav">
                <!-- RTL: the right-pointing arrow goes back -->
                <button type="button" aria-label="المشروع السابق" (click)="prev()">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" /></svg>
                </button>
                <button type="button" aria-label="المشروع التالي" (click)="next()">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6" /></svg>
                </button>
            </div>
        </div>

        <!-- Next projects -->
        <ul class="project-cards" uk-scrollspy="cls: uk-animation-slide-bottom-small; delay: 200"
            (touchstart)="swipe.start($event)" (touchend)="onSwipe($event)">
            <li *ngFor="let item of cards; trackBy: trackById">
                <button type="button" class="project-card" (click)="show(projectArr.indexOf(item))"
                    [attr.aria-label]="'عرض ' + item.name">
                    <img [src]="'assets/img/projects/' + item.img" alt="" loading="lazy">
                    <span class="project-body">
                        <span class="project-name">{{item.name}}</span>
                        <span class="project-meta">
                            <img src="assets/img/new-landing-page/icons/location.svg" alt="">
                            {{item.location}}
                        </span>
                        <span class="project-meta">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="3.5" y="5" width="17" height="15.5" rx="2" />
                                <path d="M3.5 10h17M8 3v4m8-4v4" />
                            </svg>
                            {{item.year}}
                        </span>
                    </span>
                </button>
            </li>
        </ul>

        <div class="projects-footer">
            <app-wa-cta label="ابدأ مشروعك معنا" type="StartProject"
                message="مرحباً، شاهدت مشروعاتكم وأريد تنفيذ مشروعي بمنتجات المرسال كلر."></app-wa-cta>

            <div class="dots" role="group" aria-label="التنقل بين المشروعات">
                <button *ngFor="let item of projectArr; let i = index; trackBy: trackById" type="button"
                    [class.active]="i === projectPos" [attr.aria-current]="i === projectPos"
                    [attr.aria-label]="'المشروع ' + (i + 1)" (click)="show(i)"></button>
            </div>
        </div>
    </div>
</section>
