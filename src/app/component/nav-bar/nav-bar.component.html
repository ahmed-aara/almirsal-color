<div class="nav_website" [class]="navbar_type">
    <div class="uk-container">
        <nav [class]="navbar_type" class="uk-navbar-container py-1" uk-navbar>

            <div [class]="navbar_type === 'one' ? 'uk-navbar-right' : 'uk-navbar-left'" class="">
                <ul class="uk-navbar-nav">
                    <li class="uk-active" uk-scrollspy="cls: uk-animation-fade; delay: 300; repeat: false"><a href=""
                            [style]="navbar_type === 'one' ? 'justify-content: flex-start !important;' : 'justify-content: flex-end !important;'"><img
                                width="60%" src="assets/img/logo.png" alt=""></a></li>
                </ul>
            </div>

            <div [class]="navbar_type === 'one' ? 'uk-navbar-left' : 'uk-navbar-right'">

                <ul class="uk-navbar-nav" *ngIf="navbar_type === 'two'">
                    <li class="uk-active" uk-scrollspy="cls: uk-animation-fade; delay: 300; repeat: false"><a
                            class="f_Bold" routerLink="/about">من نحن</a></li>
                    <li uk-scrollspy="cls: uk-animation-fade; delay: 300; repeat: false"><a class="f_Bold"
                            routerLink="/">اتصل
                            بنا</a></li>
                    <li uk-scrollspy="cls: uk-animation-fade; delay: 300; repeat: false"><a class="f_Bold"
                            routerLink="/">الصفحة الرئيسية</a></li>
                </ul>

            </div>

        </nav>
    </div>
</div>

<div [class]="navbar_type" class="nav_mobile full_w">

    <div class="uk-container">
        <nav class="" uk-navbar>

            <div class="uk-navbar-left logo_ text-left full_h">
                <div class="full_w full_h uk-flex uk-flex-center uk-flex-middle">
                    <a routerLink="/">
                        <img width="100%" src="assets/img/logo.png" alt="">
                    </a>
                </div>
            </div>

            <div class="uk-navbar-right">

                <ul class="uk-navbar-nav full_h">

                    <li class="px-1">
                        <a uk-toggle="target: #offcanvas-menu">
                            <div style="width: 30px;">
                                <img width="100%"
                                    [src]="navbar_type === 'one' ? 'assets/img/menu.svg' : 'assets/img/menu_white.svg'    "
                                    alt="">
                            </div>
                        </a>
                    </li>

                </ul>

            </div>

        </nav>
    </div>

</div>

<div id="offcanvas-menu" uk-offcanvas="flip: true; overlay: true">
    <div class="uk-offcanvas-bar">

        <button class="uk-offcanvas-close lightnescafeC_" type="button" uk-close></button>

        <div class="body_">
            <h2 class="lightnescafeC_ mt-3" style="font-size: 1.8rem;">القائمة الرئيسية</h2>

            <div class="line_ yellowBG_ full_w my-3"></div>

            <div class="uk-grid-small uk-child-width-1-1@l links_ mt-3" uk-grid>
                <div *ngFor="let item of pagesArr" class="text-right">
                    <a routerLink="{{item.link}}" (click)="closeOffcanvas('offcanvas-menu')"
                        class="lightnescafeC_">{{item.name}}</a>
                </div>
            </div>

            <h2 class="lightnescafeC_ mt-3">بعض منتجاتنا</h2>

            <div class="uk-flex uk-flex-right my-1">
                <div class="line_ yellowBG_ full_w " style="width: 50% !important;"></div>
            </div>

                <div *ngFor="let item of productArr; let i = index" style="margin-bottom: 1px;">
                    <a [routerLink]="'/product/' + item.id" (click)="closeOffcanvas('offcanvas-menu')">
                        <p class="lightnescafeC_ f_Bold"><span class="f_ExtraBold lightnescafeC_" style="font-size: 1.5rem;">{{i + 1}}.</span> {{item.name}}</p>
                    <p hidden class="lightnescafeC_">السعر: {{item.price | number : '1.2-2'}} جنيه</p>
                    </a>
                    
                </div>

        </div>

    </div>
</div>
