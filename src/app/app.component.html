<!-- Pages on the new design (home, product details) use the new header and footer -->
<ng-container *ngIf="newTheme !== null">
    <app-home-header *ngIf="newTheme"></app-home-header>
    <app-nav-bar *ngIf="!newTheme" [navbar_type]="navbar_type"></app-nav-bar>
</ng-container>
<router-outlet></router-outlet>
<ng-container *ngIf="newTheme !== null">
    <app-site-footer *ngIf="newTheme"></app-site-footer>
    <app-footer *ngIf="!newTheme"></app-footer>
</ng-container>

<!-- This is the modal with the default close button -->
<div id="modal-close-default" uk-modal>
    <div class="uk-modal-dialog uk-modal-body modal_">
        <button class="uk-modal-close-default close_btn" type="button" uk-close (click)="closeModal()"></button>

        <div class="uk-grid-small mt-2" uk-grid>

            <div class="uk-width-expand">
                <h3 class="f_Bold darkbrownC_">خصم 15% على اول اوردر</h3>
                <h4 class="nescafeC_">من المرسال كلر</h4>

                <div class="uk-grid-small uk-child-width-1-1@l mt-2" uk-grid>

                    <div>
                        <h6>أسمك</h6>
                        <input type="text" class="uk-input" [(ngModel)]="messageData.name">
                    </div>

                    <div>
                        <h6>رقم الهاتف</h6>
                        <input type="number" onkeypress="validate(event)" class="uk-input"
                            [(ngModel)]="messageData.phone">
                    </div>

                    <div>
                        <button (click)="sendMessage()" class="btn_ f_Bold">أحصل على العرض</button>
                    </div>

                    <div *ngIf="error_msg">
                        <h6 class="redC_ f_Regular">*{{error_msg}}*</h6>
                    </div>

                </div>
            </div>

            <div class="uk-width-auto img_box">
                <div style="width: 12rem;">
                    <img class="full_w" src="assets/img/offer_img.png" alt="">
                </div>
            </div>

        </div>

    </div>
</div>
